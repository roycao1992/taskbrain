<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskBrain</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .note-content p { margin: 0 0 0.5em; }
      .note-content p:last-child { margin-bottom: 0; }
      .note-content ul, .note-content ol { margin: 0.5em 0; padding-left: 1.2em; }
      .note-content code { background: rgba(0,0,0,0.06); padding: 0.1em 0.3em; border-radius: 4px; font-size: 0.9em; }
      .note-content pre { margin: 0.5em 0; overflow-x: auto; }
      .note-content pre code { padding: 0.5em; display: block; }
      .note-content strong { font-weight: 600; }
      .note-content a { color: #2563EB; text-decoration: none; }
      .note-content a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
